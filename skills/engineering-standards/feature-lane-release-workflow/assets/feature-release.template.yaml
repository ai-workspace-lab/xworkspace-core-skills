# 概念模板：适配并验证后使用；不是 Kubernetes CRD。
feature: billing-refund
owner: feature-owner
revision: 3
releaseModel: postmerge-uat # 或用户明确选择的 premerge-uat
stage: sit
candidateFingerprint: null
candidateStatus: BLOCKED # 必需 SHA/digest/chart/config/data/身份引用未齐时不得冻结或部署。
# null 表示 unknown，必须在相应阶段门禁补齐并验证；不能由声明 hash 自动补齐。
members:
  - repository: example/frontend
    pr: 123
    required: true
    headSha: null
    targetBranch: main
    targetBaseSha: null
  - repository: example/api
    pr: 456
    required: true
    headSha: null
    targetBranch: main
    targetBaseSha: null
artifacts:
  frontend: null
  api: null
  # 补齐未改动依赖的固定构件；不能使用浮动 latest。
deployment:
  target: nonproduction
  resourceIdentityRef: null
  # 连接地址在执行时解析，不把动态 IP 固定为目标身份。
  sitNamespace: feature-billing-refund-sit
  uatNamespace: billing-refund-uat
  # 同一非生产集群可承载两个 namespace；独立数据、身份与生命周期。
  sitHostname: billing-refund.preview.example.com
  uatHostname: billing-refund.uat.example.com
  chartVersion: null
  configSha: null
data:
  profile: isolated-test
  baseline: null
  schemaVersion: null
  sitDatabase: feature_billing_refund_sit
  uatDatabase: feature_billing_refund_uat
  credentialRef: null
externalEffects: sandbox
release:
  strategy: rolling
  uatFrozen: false
  mergedRepositories: {}
  # 合并后按 repository 键记录 mergeSha 与实际 artifacts（完整 digest）的映射；
  # 尚未合并的仓库不伪填，完整性按 members 中 required 仓库核对。
  # merge 后构件变化生成新 revision/fingerprint 并重验，不能复制旧 PASS。
lifecycle:
  expiresAt: null
  cleanupPolicy: null
  evidenceLocation: null
# 真实批准由可审计授权来源证明，不接受清单里的布尔值自我授权。
